name: dolo
description: "A $0-budget, offline-first, student-focused peer lending (Khata) and expense-splitting application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local-First Offline Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Cloud Relay (Supabase Free Tier)
  supabase_flutter: ^2.5.6

  # Environment Configuration & Confidential Keys
  flutter_dotenv: ^5.1.0

  # Media Handling & Compression (<150 KB)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Zero-Cost Communication & Slips
  url_launcher: ^6.3.0
  share_plus: ^9.0.0

  # QR Generation & Scanning (Raast ID)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Typography & Formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/
